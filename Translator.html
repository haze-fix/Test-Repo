<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Romaji Translator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; background: #121212; color: #fff; }
    textarea { width: 100%; height: 100px; background: #222; color: #fff; border: 1px solid #444; border-radius: 8px; padding: 10px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; margin-top: 10px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #output { margin-top: 20px; padding: 15px; background: #1e1e1e; border-radius: 8px; font-size: 1.2rem; color: #4ade80; }
  </style>
</head>
<body>

  <h2>Romaji Script Translator</h2>
  <textarea id="inputText" placeholder="Type your English script line here..."></textarea>
  <button onclick="translateScript()">Translate</button>

  <div id="output">Romaji translation will appear here...</div>

  <script>
  const API_KEY = "AQ.Ab8RN6LQemw7fJg-ytU-gke6JdkVZ3WXIk5vOVrjbUUfw7Qm0A";

  async function translateScript() {
    const text = document.getElementById("inputText").value;
    const outputDiv = document.getElementById("output");
    if (!text.trim()) return;

    outputDiv.innerText = "Translating...";

    // Simplified prompt to reduce latency
    const systemPrompt = "Translate English to casual Japanese (tameguchi) in Romaji ONLY. Use slashes (/) for speech pauses.";

    try {
      // Changed endpoint to streamGenerateContent + SSE parameter
      const response = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:streamGenerateContent?alt=sse", 
        {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "x-goog-api-key": API_KEY
          },
          body: JSON.stringify({
            contents: [
              { role: "user", parts: [{ text: systemPrompt + "\n\nInput: " + text }] }
            ]
          })
        }
      );

      outputDiv.innerText = ""; // Clear loader text

      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value);
        const lines = chunk.split("\n");

        for (const line of lines) {
          if (line.startsWith("data: ")) {
            try {
              const json = JSON.parse(line.replace("data: ", ""));
              const textChunk = json.candidates[0]?.content?.parts[0]?.text || "";
              outputDiv.innerText += textChunk; // Append incoming text live
            } catch (e) {
              // Ignore empty chunk parses
            }
          }
        }
      }
    } catch (err) {
      outputDiv.innerText = "Error streaming translation.";
    }
  }
</script>
</body>
</html>
